name = "elfia-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "elfiaofficialstore.my/api/*", zone_name = "elfiaofficialstore.my" },
  { pattern = "www.elfiaofficialstore.my/api/*", zone_name = "elfiaofficialstore.my" },
  # v1.22.0 — the catalog's public address (CEO: "The slug url should make
  # something nice which should not appear as API"). The engine owns this ONE
  # exact path too, so the link customers see is
  # elfiaofficialstore.my/catalog.pdf — same generated document, same live
  # prices, no /api/ in sight. Deliberately VERSIONLESS: the whole point of
  # the live-priced catalog is one permanent link that never goes stale; the
  # version lives in the downloaded file's NAME (CATALOG_FILENAME below).
  # The /catalog PAGE is a different path and stays with the website.
  { pattern = "elfiaofficialstore.my/catalog.pdf", zone_name = "elfiaofficialstore.my" },
  { pattern = "www.elfiaofficialstore.my/catalog.pdf", zone_name = "elfiaofficialstore.my" },
  # v1.24.0 — the product share link's public address (CEO: "Check all the
  # url to ensure that there is no API such like this
  # https://elfiaofficialstore.my/api/v1/share/24"). Same engine route that
  # serves the per-product preview page; the link a customer shares now
  # reads elfiaofficialstore.my/share/24. The old /api/v1/share/... address
  # keeps answering, so links already sitting in chats keep working.
  { pattern = "elfiaofficialstore.my/share/*", zone_name = "elfiaofficialstore.my" },
  { pattern = "www.elfiaofficialstore.my/share/*", zone_name = "elfiaofficialstore.my" },
]

# ---- store facts (public, safe in this file) ----
# EDIT THESE before the first deploy:
[vars]
# The shop's public origin. Gateway callback/return URLs and the allowed
# CORS origins are built from this — no domain is written into the source.
STORE_URL = "https://elfiaofficialstore.my"
# "No joy buyer": how long an unpaid order holds its stock before the cron
# releases it, and how many unpaid orders one phone may hold at once.
ORDER_HOLD_HOURS = "12"
MAX_OPEN_ORDERS = "2"
# The account customers transfer to, shown at checkout and on the order page.
# The CEO gave the number and the holder on 26-08-2026. The account belongs to
# the company that runs this shop, so its legal name appears here: a customer
# whose banking app shows a different payee than the shop told them to expect
# abandons the transfer, and a name mismatch is how a transfer bounces.
# The bank is Maybank (the CEO, 26-08-2026). It leads the line because that is
# the order the customer works in: choose the destination bank in their banking
# app, key the account number, then check the payee name the app shows them
# against the one printed here. The line is complete now — bank, account,
# holder — and this is the whole payment instruction the shop gives.
#
# DO NOT COPY THIS VALUE ANYWHERE ELSE IN THIS REPO. Not into a CHANGELOG
# entry, not into a test fixture, not into an explaining comment.
# tests/brand-isolation.mjs exempts THIS LINE and nothing else, and it has
# already refused a deploy for each of those three mistakes. Describe the
# value, never paste it: a repo that names the account in six places is a
# repo where changing the account misses five of them.
BANK_LINE = "Maybank 5511 0086 5300 — A 2 Z Creative Marketing"
# Digits only, country code first, no + and no spaces — this is pasted
# straight into a wa.me link. +60 12 383 4821 -> 60123834821.
WHATSAPP_DIGITS = "60123834821"
# v1.22.0 — what the catalog FILE is called when someone downloads, saves or
# forwards it (the CEO, 26-08-2026: "Catalog PDF will be name as Catalog
# ELFIA v1"). ".pdf" is added by the code. When v2 of the catalog ships,
# change this line and deploy — the LINK above stays the same forever.
CATALOG_FILENAME = "Catalog ELFIA v1"
# v1.13.0 — these two are now the FALLBACK, not the setting.
# The CEO owns delivery pricing in the portal (ELFIA tab -> Delivery
# charges); it arrives on the bridge feed and is stored in sync_state, and
# storeConfig() prefers that. These values answer until the first pull lands,
# and if the portal ever stops sending them. Editing them still works and
# still needs a deploy, which is exactly why the portal took the job over.
#
# The free-delivery threshold was RM 150 and is now RM 45 on the CEO's
# instruction of 26-08-2026: "I will provide a free delivery fees" above
# RM 45.00. Set here as well as in the portal so the shop is right the moment
# this deploys, rather than for the one minute until the first pull.
SHIPPING_CENTS = "1000"        # RM 10 flat
FREE_ABOVE_CENTS = "4500"      # free delivery from RM 45
# The portal bridge endpoints are SECRETS, not vars — this file is committed,
# and no other company's domain may live in this repo (tests/brand-isolation.mjs
# enforces that). Set all three from your machine:
#   npx wrangler secret put BRIDGE_URL       <- portal inventory+prices feed (GET)
#   npx wrangler secret put BRIDGE_PUSH_URL  <- portal movements endpoint (POST)
#   npx wrangler secret put BRIDGE_KEY       <- same value as the portal's ELFIA_BRIDGE_KEY
# See PORTAL-BRIDGE-SPEC.md for what the portal must serve at those URLs.

# v0.8.0 — the inventory sync runs by itself: it delivers any sales the portal
# has not seen yet, then refreshes counts, prices, photos and the carousel
# from the portal. Sales are ALSO pushed the instant an order is placed; this
# schedule is the safety net for when the portal was unreachable then.
#
# v1.9.0 — EVERY MINUTE, not every five. The CEO changes a price in the
# portal and looks straight at the shop ("still the discount is not live
# update!!!!"); a five-minute wait with no way to hurry it up reads as
# broken, however correct it is. One minute is Cloudflare's floor and costs
# 1,440 invocations a day, which is nothing. The portal's "Update the shop
# now" button covers the rest by calling /bridge/sync-now directly.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "elfia-store"
# ONE-TIME SETUP: run `wrangler d1 create elfia-store` and paste the
# database_id it prints below.
database_id = "d1e1bb9f-1360-417e-8932-0c9009f5115c"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "elfia-media"
# ONE-TIME SETUP: run `wrangler r2 bucket create elfia-media`

# Secrets (never in this file):
#   wrangler secret put ADMIN_KEY           <- the /admin passcode
# Stage B (online FPX payment) — Bayarcash (v1.46.0; replaced Billplz).
# Set all three with  DEPLOY.bat gateway  (or one at a time):
#   wrangler secret put BAYARCASH_PAT      <- Personal Access Token (Bayarcash console -> profile)
#   wrangler secret put BAYARCASH_PORTAL   <- Portal Key of the portal that takes the money
#   wrangler secret put BAYARCASH_SECRET   <- API Secret Key (signs what we send, verifies callbacks)
#      Without the secret no payment is ever raised: a callback the shop
#      cannot verify is one it must not act on, so the card is not offered.
# To TEST against the Bayarcash sandbox first (separate account at
# console.bayarcash-sandbox.com), add under [vars]:  BAYARCASH_SANDBOX = "1"
# and use the sandbox account's token/portal/secret. Remove it for production.
