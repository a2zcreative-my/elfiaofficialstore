name = "elfia-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "elfiaofficialstore.my/api/*", zone_name = "elfiaofficialstore.my" },
  { pattern = "www.elfiaofficialstore.my/api/*", zone_name = "elfiaofficialstore.my" },
]

# ---- store facts (public, safe in this file) ----
# EDIT THESE before the first deploy:
[vars]
# The shop's public origin. Billplz callback/redirect URLs and the allowed
# CORS origins are built from this — no domain is written into the source.
STORE_URL = "https://elfiaofficialstore.my"
# "No joy buyer": how long an unpaid order holds its stock before the cron
# releases it, and how many unpaid orders one phone may hold at once.
ORDER_HOLD_HOURS = "12"
MAX_OPEN_ORDERS = "2"
BANK_LINE = "REPLACE — e.g. MAYBANK 1234 5678 9012 — ELFIA"
WHATSAPP_DIGITS = "60000000000"
SHIPPING_CENTS = "1000"        # RM 10 flat
FREE_ABOVE_CENTS = "15000"     # free delivery from RM 150
# Stock sync with the agency portal — paste the two bridge endpoints here.
# Both live on the portal; see PORTAL-BRIDGE-SPEC.md for the contract.
#   BRIDGE_URL       GET  — the portal's live inventory feed  (portal -> store)
#   BRIDGE_PUSH_URL  POST — where this store reports its sales (store -> portal)
# e.g. "https://<the portal domain>/api/v1/bridge/elfia-inventory"
#      "https://<the portal domain>/api/v1/bridge/elfia-movements"
BRIDGE_URL = "REPLACE — portal inventory feed URL"
BRIDGE_PUSH_URL = "REPLACE — portal movements endpoint URL"

# v0.8.0 — the inventory sync runs by itself every 5 minutes: it delivers any
# sales the portal has not seen yet, then refreshes counts from the portal.
# Sales are ALSO pushed the instant an order is placed; this schedule is the
# safety net for when the portal was unreachable at that moment.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "elfia-store"
# ONE-TIME SETUP: run `wrangler d1 create elfia-store` and paste the
# database_id it prints below.
database_id = "d1e1bb9f-1360-417e-8932-0c9009f5115c"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "elfia-media"
# ONE-TIME SETUP: run `wrangler r2 bucket create elfia-media`

# Secrets (never in this file):
#   wrangler secret put ADMIN_KEY           <- the /admin passcode
#   wrangler secret put BRIDGE_KEY          <- stock-sync secret; MUST equal
#                                              ELFIA_BRIDGE_KEY on the portal
# Stage B (online FPX payment) — when the Billplz account is approved:
#   wrangler secret put BILLPLZ_SECRET      <- API Secret Key (Billplz dashboard -> Settings)
#   wrangler secret put BILLPLZ_COLLECTION  <- the Collection ID you create there
#   wrangler secret put BILLPLZ_XSIGN       <- the X Signature Key (same page)
#      Without XSIGN the store still refuses to trust a callback (every bill is
#      re-queried against Billplz), but WITH it a forged callback is thrown out
#      before it costs a network call. Set it.
# To TEST against the Billplz sandbox first (separate account at
# billplz-sandbox.com), add under [vars]:  BILLPLZ_SANDBOX = "1"
# and use the sandbox account's secret/collection. Remove it for production.
